name: Gerar vídeo Davi e Golias

on:
  workflow_dispatch: {}

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm install

      - name: Gerar imagens e narração (Pollinations.ai — grátis, sem chave)
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: npm run generate-assets

      - name: Renderizar vídeo com Remotion
        run: npm run build

      - name: Disponibilizar vídeo pra download
        uses: actions/upload-artifact@v4
        with:
          name: davi-e-goliath-video
          path: out/video.mp4
